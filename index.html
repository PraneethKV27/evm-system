<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SecEVM — Start Required</title>
  <style>
    body { background:#080b11; color:#f3f4f6; font-family:Segoe UI,sans-serif;
           display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .card { text-align:center; padding:2rem 2.5rem; max-width:520px;
            border:1px solid rgba(255,255,255,.1); border-radius:12px; background:rgba(17,22,34,.9); }
    h2 { margin:0 0 1rem; }
    p { color:#9ca3af; line-height:1.6; }
    .warn { color:#fbbf24; font-weight:600; margin:1rem 0; }
    a.btn { display:inline-block; margin-top:1rem; padding:.75rem 1.5rem;
            background:linear-gradient(135deg,#06b6d4,#6366f1); color:#fff;
            text-decoration:none; font-weight:bold; border-radius:8px; }
  </style>
  <script>
    (function () {
      if (location.protocol === "file:") {
        document.addEventListener("DOMContentLoaded", function () {
          document.getElementById("fileWarning").style.display = "block";
          document.getElementById("liveLink").style.display = "none";
        });
        return;
      }
      location.replace("http://localhost:3010/");
    })();
  </script>
</head>
<body>
  <div class="card">
    <h2>SecEVM Secure Console</h2>
    <p id="fileWarning" class="warn" style="display:none">
      You opened this folder directly in the browser.<br>
      The fingerprint backend cannot run this way.
    </p>
    <p>
      <strong>From your Desktop folder, double-click:</strong><br>
      <code>START SecEVM.bat</code> or <code>SecEVM.bat</code>
    </p>
    <p>Keep that window open. The app will open at <strong>http://localhost:3010</strong></p>
    <a id="liveLink" class="btn" href="http://localhost:3010/">Open SecEVM (server running)</a>
  </div>
</body>
</html>
